name: Rhyzome Frontend - CI
on:
  push:
    branches: [develop, desarrollo, release, master]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:report
        env:
          VITE_API_BASE_URL: https://example.test
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-test-key
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://example.test
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-test-key
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            reports/
            coverage/
